server.port=${SERVER_PORT:8080}
server.servlet.session.timeout=30m
server.servlet.session.cookie.name=${SESSION_COOKIE_NAME:oficiocr.session}
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/oficiocr}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${POSTGRES_USER:oficiocr}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${POSTGRES_PASSWORD:oficiocr_local}}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.session.store-type=redis
spring.session.timeout=30m
spring.session.redis.namespace=oficiocr:sessions
spring.session.redis.flush-mode=on_save
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.mail.host=${SMTP_HOST:}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_SSL:true}
app.frontend-origin=${FRONTEND_ORIGIN:http://localhost:4200}
app.environment=${SPRING_PROFILES_ACTIVE:development}
app.smtp-from=${SMTP_FROM:}
app.test-endpoints=${ENABLE_TEST_ENDPOINTS:true}
