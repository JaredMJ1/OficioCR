services:
  postgres:
    image: postgres:16-alpine
    container_name: oficiocr-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-oficiocr}
      POSTGRES_USER: ${POSTGRES_USER:-oficiocr}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-oficiocr_local}
    ports:
      - "5432:5432"
    volumes:
      - oficiocr-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    container_name: oficiocr-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - oficiocr-sessions:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
  api:
    build: ./backend/spring-api
    restart: unless-stopped
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-oficiocr}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-oficiocr}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-oficiocr_local}
      SUPERUSER_EMAIL: ${SUPERUSER_EMAIL:-admin@oficiocr.local}
      SUPERUSER_PASSWORD: ${SUPERUSER_PASSWORD:-AdminOficioCR!2026}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:4200,http://127.0.0.1:4200}
      ENABLE_TEST_ENDPOINTS: ${ENABLE_TEST_ENDPOINTS:-true}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SSL: ${SMTP_SSL:-true}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-development}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
      SERVER_PORT: 8080
      REDIS_HOST: redis
      REDIS_PORT: 6379
    ports:
      - "7001:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "4200:80"
    depends_on:
      - api
volumes:
  oficiocr-data:
  oficiocr-sessions:
