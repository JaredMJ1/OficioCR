spring:
  application:
    name: OficioCR

  datasource:
    url: jdbc:postgresql://localhost:5432/oficiocr_db
    username: postgres
    password: ${DB_PASSWORD}

  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true

server:
  port: 8081

logging:
  level:
    org.flywaydb: DEBUG
    org.springframework.boot.autoconfigure.flyway: DEBUG
